<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Windy List</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#121218;color:#eee;font-family:system-ui,sans-serif;text-align:center}
img{width:96px;border-radius:20px}button{margin-top:16px;padding:10px 22px;border:0;border-radius:8px;background:#4da3ff;color:#000;font-size:16px;cursor:pointer}</style></head>
<body><div><img src="icon.png" alt=""><h2>Can't reach Windy List</h2><p>Check your connection and try again.</p>
<p id="d" style="opacity:.6;font-size:13px;word-break:break-all"></p><button onclick="location.href='https://windylist.pl'">Retry</button></div><script>var q=new URLSearchParams(location.search);if(q.get('code'))document.getElementById('d').textContent=q.get('desc')+' ('+q.get('code')+') '+(q.get('url')||'');</script></body></html>
