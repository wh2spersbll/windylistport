<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b0e">
<title>Windy List</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="hero">
    <h1>Windy List</h1>
    <p>Geometry Dash Community Level List</p>
  </header>

  <main id="view"></main>
</div>

<div id="dock">
  <div id="searchbar" class="glass">
    <button id="searchbtn" type="button">Search</button>
    <input id="searchin" type="search" placeholder="Search…" autocomplete="off" autocapitalize="off" hidden>
  </div>
  <nav id="tabbar" class="glass">
    <button data-tab="list" class="on">List</button>
    <button data-tab="stats">Stats</button>
    <button data-tab="account">Account</button>
  </nav>
</div>

<section id="sheet" hidden>
  <div id="sheet-top"><button id="sheet-back" type="button">‹ Back</button></div>
  <div id="sheet-body"></div>
</section>

<script src="app.js"></script>
</body>
</html>
