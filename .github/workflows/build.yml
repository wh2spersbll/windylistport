name: Build apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npm install
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.pacman
            dist/*.tar.gz
            dist/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#121218'
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WindyList-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx cap add ios
      - run: npx @capacitor/assets generate --ios --iconBackgroundColor '#121218'
      - run: npx cap sync ios
      - name: Build unsigned .app
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -destination 'generic/platform=iOS' -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned .ipa
        run: |
          mkdir Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr WindyList-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WindyList-ipa
          path: WindyList-unsigned.ipa
